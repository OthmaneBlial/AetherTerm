[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherterm"
version = "0.1.0a0"
description = "A self-hosted browser terminal for explicitly enrolled agents"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{name = "Othmane Blial"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Shells",
]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "websockets==17.1",
]

[project.optional-dependencies]
dev = ["build==1.6.1", "ruff==0.16.7"]

[project.scripts]
aetherterm-admin = "server.admin:main"
aetherterm-agent = "client.main:main"
aetherterm-server = "server.cli:main"

[tool.setuptools]
packages = ["server", "client", "aetherterm_assets"]
package-dir = {aetherterm_assets = "web"}
include-package-data = false

[tool.setuptools.package-data]
aetherterm_assets = ["*.html", "*.svg", "*.ico", "assets/*", "licenses/*"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
