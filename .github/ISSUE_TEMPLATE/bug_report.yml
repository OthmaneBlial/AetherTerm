name: Bug report
description: Report a reproducible product defect without secrets
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For access-control vulnerabilities, read SECURITY.md first. Do not put exploits or credentials in a public issue."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "Commit SHA or package version"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python, browser, loopback or TLS proxy"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use disposable data; remove tokens, cookies and private host details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
