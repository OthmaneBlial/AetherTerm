name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan Git history for leaked secrets
        run: |
          curl -fsSL --retry 2 --max-time 45 \
            -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  linux-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install source and build tools
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
      - name: Lint Python sources
        run: ruff check server client tests scripts
      - name: Type-check server and agent
        run: mypy server client
      - name: Check local documentation links
        run: python scripts/check_docs.py
      - name: Run protocol, security and real PTY tests
        run: python -m unittest discover -s tests -q
      - name: Check disposable local demo setup and cleanup
        run: python -m scripts.demo_local --check
      - name: Check Linux user service syntax
        run: |
          install -d -m 700 "$HOME/.local/share/aetherterm/venv/bin"
          ln -s "$(command -v aetherterm-agent)" "$HOME/.local/share/aetherterm/venv/bin/aetherterm-agent"
          systemd-analyze verify packaging/aetherterm-agent@.service
      - name: Build wheel and source archive
        run: python -m build --wheel --sdist
      - name: Check source archive contains dependency locks
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile

          archive, = Path("dist").glob("*.tar.gz")
          expected = {"requirements.lock", "requirements-runtime.lock", "requirements-freeze.lock"}
          with tarfile.open(archive, "r:gz") as source:
              included = {Path(name).name for name in source.getnames()}
          missing = expected - included
          if missing:
              raise SystemExit(f"Source archive is missing: {', '.join(sorted(missing))}")
          PY
      - name: Check installed wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/aetherterm-wheel"
          "$RUNNER_TEMP/aetherterm-wheel/bin/python" -m pip install --upgrade pip==26.2.1
          "$RUNNER_TEMP/aetherterm-wheel/bin/python" -m pip install --require-hashes -r requirements-runtime.lock
          "$RUNNER_TEMP/aetherterm-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/aetherterm-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/aetherterm-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/verify_installed_wheel.py"
      - name: Audit installed Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --path "$RUNNER_TEMP/aetherterm-wheel/lib/python3.13/site-packages" --progress-spinner off
      - name: Hash built Python distributions
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Keep tested Python distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  web-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and check frontend
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
          npm audit --audit-level=high
      - name: Check committed assets match source
        run: git diff --exit-code -- web/assets

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install app and browser test driver
        run: |
          python -m pip install --require-hashes -r requirements-runtime.lock
          python -m pip install --no-deps .
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise the real browser journey
        run: python scripts/verify_browser.py
        env:
          AETHERTERM_BROWSER: ${{ matrix.browser }}
          AETHERTERM_SCREENSHOT_DIR: artifacts/screenshots
      - name: Keep real browser screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.browser }}-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install host agent for smoke test
        run: |
          python -m pip install --require-hashes -r requirements-runtime.lock
          python -m pip install --no-deps .
      - name: Build non-root server image
        run: docker build --tag aetherterm:ci .
      - name: Exercise container server with real Linux PTY
        run: python scripts/verify_container.py

  linux-agent-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install frozen-agent builder
        run: |
          python -m pip install --require-hashes -r requirements-freeze.lock
          python -m pip install --no-deps .
      - name: Build Linux x86_64 agent
        run: |
          test "$(uname -m)" = x86_64
          pyinstaller --onefile --clean --noconfirm --name aetherterm-agent \
            --paths "$GITHUB_WORKSPACE" \
            --specpath "$RUNNER_TEMP/aetherterm-pyi-spec" \
            --workpath "$RUNNER_TEMP/aetherterm-pyi-build" \
            --distpath artifacts/bin scripts/frozen_agent.py
          agent_version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("aetherterm"))')
          mv artifacts/bin/aetherterm-agent "artifacts/bin/aetherterm-agent-${agent_version}-linux-x86_64"
          file "artifacts/bin/aetherterm-agent-${agent_version}-linux-x86_64"
          "artifacts/bin/aetherterm-agent-${agent_version}-linux-x86_64" --help
      - name: Test built agent against installed-wheel server
        run: |
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/aetherterm-binary-wheel"
          "$RUNNER_TEMP/aetherterm-binary-wheel/bin/python" -m pip install --require-hashes -r requirements-runtime.lock
          "$RUNNER_TEMP/aetherterm-binary-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          agent_version=$("$RUNNER_TEMP/aetherterm-binary-wheel/bin/python" -c 'import importlib.metadata; print(importlib.metadata.version("aetherterm"))')
          AETHERTERM_AGENT_BINARY="$GITHUB_WORKSPACE/artifacts/bin/aetherterm-agent-${agent_version}-linux-x86_64" \
            "$RUNNER_TEMP/aetherterm-binary-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/verify_installed_wheel.py"
          cd "$GITHUB_WORKSPACE/artifacts/bin"
          sha256sum aetherterm-agent-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Keep tested Linux agent binary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-agent-x86_64
          path: artifacts/bin/*
          if-no-files-found: ignore
          retention-days: 7
