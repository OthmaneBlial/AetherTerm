name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install source and build tools
        run: python -m pip install . build
      - name: Run protocol, security and real PTY tests
        run: python -m unittest discover -s tests -q
      - name: Build wheel and source archive
        run: python -m build --wheel --sdist
      - name: Check installed wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/aetherterm-wheel"
          "$RUNNER_TEMP/aetherterm-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/aetherterm-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/aetherterm-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/verify_installed_wheel.py"

  web-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and check frontend
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
      - name: Check committed assets match source
        run: git diff --exit-code -- web/assets
