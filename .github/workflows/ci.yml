name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install source and build tools
        run: python -m pip install . build
      - name: Run protocol, security and real PTY tests
        run: python -m unittest discover -s tests -q
      - name: Build wheel and source archive
        run: python -m build --wheel --sdist
      - name: Check installed wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/aetherterm-wheel"
          "$RUNNER_TEMP/aetherterm-wheel/bin/python" -m pip install --upgrade pip==26.2.1
          "$RUNNER_TEMP/aetherterm-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/aetherterm-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/aetherterm-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/verify_installed_wheel.py"
      - name: Audit installed Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --path "$RUNNER_TEMP/aetherterm-wheel/lib/python3.13/site-packages" --progress-spinner off

  web-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and check frontend
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
          npm audit --audit-level=high
      - name: Check committed assets match source
        run: git diff --exit-code -- web/assets
