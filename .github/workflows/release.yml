name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish release assets
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify that the completed CI run belongs to the release tag
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$CI_SHA"
          echo "Release tag $RELEASE_TAG points to $CI_SHA"

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install the frozen release toolchain
        run: |
          python -m pip install --require-hashes -r requirements-freeze.lock
          python -m pip install --no-deps .

      - name: Require the tag and package versions to match
        run: |
          tag_version="${RELEASE_TAG#v}"
          package_version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("aetherterm"))')
          test "$tag_version" = "$package_version"

      - name: Build Python distributions
        run: python -m build --wheel --sdist

      - name: Build the Linux x86_64 agent
        run: |
          test "$(uname -m)" = x86_64
          pyinstaller --onefile --clean --noconfirm --name aetherterm-agent \
            --paths "$GITHUB_WORKSPACE" \
            --specpath "$RUNNER_TEMP/aetherterm-pyi-spec" \
            --workpath "$RUNNER_TEMP/aetherterm-pyi-build" \
            --distpath artifacts/bin scripts/frozen_agent.py
          mv artifacts/bin/aetherterm-agent "artifacts/bin/aetherterm-agent-${RELEASE_TAG#v}-linux-x86_64"

      - name: Assemble and hash release assets
        run: |
          mkdir -p release
          cp dist/*.whl dist/*.tar.gz release/
          cp "artifacts/bin/aetherterm-agent-${RELEASE_TAG#v}-linux-x86_64" release/
          (cd release && sha256sum ./* > SHA256SUMS)
          sha256sum --check release/SHA256SUMS

      - name: Create the GitHub release from the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag \
            --title "AetherTerm $RELEASE_TAG" \
            --generate-notes
